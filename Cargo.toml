[package]
name = "mabimml"
version = "2.4.11"
edition = "2021"
authors = ["LT 남븝"]
description = "마비노기 MML 변환기 (Rust판): MIDI / MusicXML / 악보 PDF / MML -> PC판 마비노기 MML"
license = "MIT"
default-run = "mabimml"
build = "build.rs"

[lib]
name = "mabimml"
path = "src/lib.rs"

[[bin]]
name = "mabimml"
path = "src/main.rs"

[[bin]]
name = "mabimml-pack"
path = "src/bin/pack.rs"

[[bin]]
name = "mabimml-cli"
path = "src/bin/cli.rs"

[dependencies]
regex = "1"
unicode-normalization = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["std"] }
num-integer = "0.1"
num-traits = "0.2"
roxmltree = "0.20"
miniz_oxide = "0.8"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
rfd = "0.15"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media_Multimedia", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
